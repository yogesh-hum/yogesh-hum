<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Yogesh Naik — YN Interactive</title>
<desc id="desc">A custom dark futuristic banner with a glowing YN monogram and purple and cyan 3D-inspired orbital rings.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070510"/><stop offset=".55" stop-color="#17102d"/><stop offset="1" stop-color="#061c2c"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b794ff"/><stop offset=".52" stop-color="#7650ff"/><stop offset="1" stop-color="#00d5ff"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".5" stop-color="#9b7bff"/><stop offset="1" stop-color="#00d5ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#9b7bff" stop-opacity=".32"/><stop offset="1" stop-color="#9b7bff" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="960" cy="170" r="230" fill="url(#orb)"/>
<g opacity=".2" stroke="#9b7bff" stroke-width="1"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"/><path d="M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/></g>
<g transform="translate(860 178)" fill="none" stroke="url(#neon)" filter="url(#glow)">
  <ellipse rx="215" ry="78" stroke-width="3" transform="rotate(-27)"/>
  <ellipse rx="180" ry="115" stroke-width="2" transform="rotate(42)" opacity=".8"/>
  <ellipse rx="130" ry="145" stroke-width="1.5" transform="rotate(78)" opacity=".6"/>
  <circle r="92" stroke-width="2" opacity=".55"/>
</g>
<g transform="translate(860 178)" filter="url(#glow)">
  <path d="M-74 -54V55L-5 -54V55M12 -54L48 0L84 -54M48 0V55" fill="none" stroke="url(#neon)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g fill="#fff" font-family="Inter,Arial,sans-serif">
  <text x="76" y="137" font-size="17" letter-spacing="6" fill="#a78bfa">HELLO, I'M</text>
  <text x="72" y="208" font-size="68" font-weight="800" letter-spacing="-2">YOGESH NAIK</text>
  <rect x="76" y="232" width="440" height="3" rx="2" fill="url(#line)"/>
  <text x="76" y="278" font-size="20" letter-spacing="2" fill="#cbd5e1">PYTHON  ·  FULL-STACK  ·  BUILDER</text>
  <text x="76" y="316" font-size="13" letter-spacing="3" fill="#7dd3fc">YN INTERACTIVE / DIGITAL WORKSPACE</text>
</g>
<circle cx="1110" cy="72" r="5" fill="#00d5ff" filter="url(#glow)"/><circle cx="690" cy="290" r="4" fill="#a78bfa" filter="url(#glow)"/>
</svg>